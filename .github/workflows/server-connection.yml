name: Owner server connection (manual only)
on:
  workflow_dispatch:
    inputs:
      allow_hosted_compute:
        description: Allow this bounded server connection check
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: leyra-server-operation
  cancel-in-progress: false
jobs:
  inspect:
    if: ${{ inputs.allow_hosted_compute == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned host and inspect service metadata without changes
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LEYRA_SSH_KEY:-}" ]]; then
            echo '::error::LEYRA_SSH_KEY has not been configured in this repository.'
            exit 1
          fi
          key_file="$RUNNER_TEMP/leyra-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" > "$key_file"
          ssh-keygen -y -f "$key_file" > /dev/null
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@43.129.187.240 'sudo -n python3 -' < deploy/inspect_existing_server.py > server-preflight.json
          python3 -m json.tool server-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: leyra-server-preflight
          path: server-preflight.json
          retention-days: 1
