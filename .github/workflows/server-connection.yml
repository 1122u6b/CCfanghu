name: Owner server connection (manual only)
on:
  workflow_dispatch:
    inputs:
      allow_hosted_compute:
        description: Allow this bounded server connection check
        type: boolean
        required: true
        default: false
      admin_login:
        description: 'Create a 7-day login link for the web management center (download within 1 day)'
        type: boolean
        required: false
        default: false
      exit_latency:
        description: 'Measure where the time goes: server → customer SOCKS5 exit → website (timings only, read-only)'
        type: boolean
        required: false
        default: false
      gateway_log:
        description: 'Show the last 3 hours of gateway connection problems (exit failures, blocked requests)'
        type: boolean
        required: false
        default: false
      new_device_name:
        description: 'Optional: create a device for this customer computer and attach its connection file (download within 1 day)'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: leyra-server-operation
  cancel-in-progress: false
jobs:
  inspect:
    if: ${{ inputs.allow_hosted_compute == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify application readiness using fixed verdicts only
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LEYRA_SSH_KEY:-}" ]]; then
            echo '::error::LEYRA_SSH_KEY has not been configured in this repository.'
            exit 1
          fi
          key_file="$RUNNER_TEMP/leyra-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          ssh-keygen -y -f "$key_file" > /dev/null
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 'sudo -n python3 -' < deploy/inspect_existing_server.py
  exit-latency:
    if: ${{ inputs.allow_hosted_compute == true && inputs.exit_latency == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Server → customer exit → website timings
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/leyra-key"; trap 'rm -f "$key_file"' EXIT; umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 'sudo -n python3 -' < deploy/measure_exit_latency.py
  gateway-log:
    if: ${{ inputs.allow_hosted_compute == true && inputs.gateway_log == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Last 3 hours of gateway connection problems
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/leyra-key"; trap 'rm -f "$key_file"' EXIT; umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 \
            "sudo -n journalctl -u leyra-server.service --since '-3h' --no-pager -o short-iso | grep -vE 'gateway request ended: (CancelledError|ConnectionResetError|IncompleteReadError|BrokenPipeError)' | tail -n 200; echo '--- counts ---'; sudo -n journalctl -u leyra-server.service --since '-3h' --no-pager | grep -oE 'upstream failed: [^ ]+ [A-Za-z]+|gateway request ended: [A-Za-z]+|Leyra private gateway started' | sort | uniq -c | sort -rn | head -30"
  device:
    if: ${{ inputs.allow_hosted_compute == true && inputs.new_device_name != '' }}
    needs: inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Create one device on the server and fetch only its connection file
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
          DEVICE_NAME: ${{ inputs.new_device_name }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/leyra-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          # The name travels base64-encoded so no shell quoting can be abused.
          encoded=$(printf '%s' "$DEVICE_NAME" | head -c 100 | base64 -w0)
          [[ "$encoded" =~ ^[A-Za-z0-9+/=]+$ ]]
          remote="release=\$(ls -d /opt/leyra-connect/releases/*/ | sort | tail -n1); name=\$(printf %s '$encoded' | base64 -d); out=\$(mktemp); sudo -n python3 \"\${release}admin.py\" --profile /root/leyra-server-connection.json --connect 127.0.0.1 device-new \"\$name\" --out \"\$out\" >/dev/null && sudo -n cat \"\$out\"; sudo -n rm -f \"\$out\""
          mkdir -p device
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 "$remote" > device/leyra-device.json
          python3 -c "import json;d=json.load(open('device/leyra-device.json'))['leyra_server'];assert d['role']=='device' and len(d['device_id'])==32;print('LEYRA_DEVICE_CREATED=YES')"
      - uses: actions/upload-artifact@v4
        with:
          name: device-connection-file
          path: device/leyra-device.json
          retention-days: 1
  admin-login:
    if: ${{ inputs.allow_hosted_compute == true && inputs.admin_login == true }}
    needs: inspect
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Create a time-limited management login link on the server
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/leyra-key"
          trap 'rm -f "$key_file"' EXIT
          umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          mkdir -p login
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 \
            'release=$(ls -d /opt/leyra-connect/releases/*/ | sort | tail -n1); sudo -n python3 "${release}admin.py" --profile /root/leyra-server-connection.json --connect 127.0.0.1 login-link' > login/link.txt
          grep -qE '^https://leyra\.xin/admin#adm_[A-Za-z0-9_-]{40,80}$' login/link.txt
          { echo '打开下面的链接进入 Leyra 管理后台（7 天内有效，请勿转发）。'; echo '进去后在「安全」页设置管理员账号密码，以后直接打开 https://leyra.xin/admin 登录即可。'; echo; cat login/link.txt; } > login/管理后台登录链接.txt
          rm login/link.txt
          echo 'LEYRA_ADMIN_LINK_CREATED=YES'
      - uses: actions/upload-artifact@v4
        with:
          name: admin-login-link
          path: login/
          retention-days: 1
