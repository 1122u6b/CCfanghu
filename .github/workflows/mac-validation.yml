name: Mac validation (explicit compute opt-in)
# Builds the Mac package (Apple silicon + Intel in one .pkg), installs it on a real Mac of each kind and runs the
# customer flow. Separate from the Windows workflow; nothing here touches the Windows client.
on:
  # A new workflow can only be started by hand once it is on the default branch; until then a push to the
  # development branch whose commit message contains [mac-ci] starts it (other pushes do not).
  push:
    branches: [claude/dazzling-maxwell-irb2ju]
    paths: ['mac/**', '.github/workflows/mac-validation.yml']
  workflow_dispatch:
    inputs:
      allow_hosted_compute:
        description: 'Allow this run to use macOS runners (metered at a higher rate than Linux)'
        type: boolean
        required: true
        default: false
      publish_to_website:
        description: 'After both Macs pass, publish this package (website download + automatic update)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: mac-validation
  cancel-in-progress: false
jobs:
  test-code:
    if: ${{ inputs.allow_hosted_compute == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mac-ci]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.issue.outputs.code }}
      ui_code: ${{ steps.issue.outputs.ui_code }}
      socks_port: ${{ steps.issue.outputs.socks_port }}
      socks_pass: ${{ steps.issue.outputs.socks_pass }}
    steps:
      - uses: actions/checkout@v4
      - name: Issue a one-day authorization code for the end-to-end test
        id: issue
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/leyra-key"; trap 'rm -f "$key_file"' EXIT; umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          code=$(ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 \
            'release=$(ls -d /opt/leyra-connect/releases/*/ | sort | tail -n1); sudo -n python3 "${release}admin.py" --profile /root/leyra-server-connection.json --connect 127.0.0.1 license-new --days 1 --note "automated Windows test"')
          [[ "$code" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          echo "code=$code" >> "$GITHUB_OUTPUT"
          ui=$(ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 \
            'release=$(ls -d /opt/leyra-connect/releases/*/ | sort | tail -n1); sudo -n python3 "${release}admin.py" --profile /root/leyra-server-connection.json --connect 127.0.0.1 license-new --days 1 --note "automated UI click-through"')
          [[ "$ui" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          echo "ui_code=$ui" >> "$GITHUB_OUTPUT"
          # A temporary SOCKS5 proxy on the server stands in for the customer's own IP (loopback only, 40 minutes).
          port=$((20000 + RANDOM % 20000)); pass=$(openssl rand -hex 12)
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 \
            "cat > /tmp/leyra-ci-socks.py && (setsid nohup python3 /tmp/leyra-ci-socks.py $port ci $pass 2400 >/dev/null 2>&1 &) && sleep 1 && ss -ltn | grep -q ':$port '" < deploy/ci_socks5.py
          # GitHub refuses to pass on a URL containing user:password@, so hand over the parts.
          echo "socks_port=$port" >> "$GITHUB_OUTPUT"; echo "socks_pass=$pass" >> "$GITHUB_OUTPUT"
  build:
    if: ${{ inputs.allow_hosted_compute == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mac-ci]')) }}
    # Current Intel image (the one the Intel install test uses): the package is cross-built for both chips here, so
    # the scarce Apple-silicon runners are kept for the install tests only. macos-13 is being retired and sat queued
    # for hours; Apple-silicon shortages kept cancelling the build.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build the Mac package (service for both chips, universal window app, mihomo for both chips)
        run: mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac-package
          path: |
            mac/out/Leyra-*.pkg
            mac/out/Leyra-*.sha256
          retention-days: 7
      - name: Keep the obfuscation name maps (for reading error logs; never shipped)
        uses: actions/upload-artifact@v4
        with:
          name: mac-obfuscation-maps
          path: artifacts/obfuscation-maps
          retention-days: 90
  test:
    needs: [build, test-code]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            chip: apple-silicon
            code_key: code
          - runner: macos-15-intel
            chip: intel
            code_key: ui_code
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-package
          path: pkg
      - name: Record this Mac's own network before installing
        run: |
          route -n get default | awk '/interface:/{print $2}' > /tmp/leyra-physical-if
          curl -s --max-time 20 https://api.ipify.org > /tmp/leyra-real-ip
          echo "physical interface $(cat /tmp/leyra-physical-if)"; uname -m; sw_vers
      - name: Install the package like a customer (installer runs as administrator)
        run: |
          sudo LEYRA_OWNER_UID=$(id -u) installer -pkg pkg/Leyra-*.pkg -target / -verboseR
          sleep 5
          sudo launchctl print system/xin.leyra.agent | head -20
          ls -la /Applications/Leyra.app/Contents/MacOS "/Library/Application Support/Leyra/agent"
          # Opens at every login, quietly in the menu bar: the login item is installed, and the app starts that way and keeps running.
          plutil -lint /Library/LaunchAgents/xin.leyra.app.plist
          [ "$(stat -f '%Su:%Sg %Lp' /Library/LaunchAgents/xin.leyra.app.plist)" = "root:wheel 644" ] || { echo "login item missing or wrong owner/permissions"; exit 1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :ProgramArguments:1' /Library/LaunchAgents/xin.leyra.app.plist)" = "--background" ] || { echo "login item does not start quietly"; exit 1; }
          /Applications/Leyra.app/Contents/MacOS/Leyra --background >/tmp/leyra-app.log 2>&1 &
          APP=$!; sleep 8
          kill -0 "$APP" || { echo "the app did not keep running when started at login"; cat /tmp/leyra-app.log; exit 1; }
          echo "app started at login and kept running (pid $APP)"; kill "$APP" || true
      - name: Customer flow (${{ matrix.chip }})
        env:
          TEST_CODE: ${{ needs.test-code.outputs[matrix.code_key] }}
          SOCKS_PORT: ${{ needs.test-code.outputs.socks_port }}
          SOCKS_PASS: ${{ needs.test-code.outputs.socks_pass }}
        run: mac/tests/e2e.sh
      - name: Coexist with the customer's own proxy app (${{ matrix.chip }})
        if: matrix.chip == 'intel'
        run: mac/tests/coexist.sh
      - name: Fresh install state for the click-through (same Mac may activate again with its code)
        if: matrix.chip == 'apple-silicon'
        run: |
          # The server remembers this computer's exits and restores them on reactivation (as for a reinstall);
          # remove them first so the click-through starts like a brand-new customer.
          python3 mac/tests/ask.py '{"type":"account"}' --full | python3 -c 'import json,sys;[print(e["id"]) for e in json.load(sys.stdin)["value"]["exits"]["list"]]' | while read id; do python3 mac/tests/ask.py "{\"type\":\"delete_exit\",\"id\":$id}"; done || true
          sudo launchctl bootout system/xin.leyra.agent || true
          sudo "/Library/Application Support/Leyra/agent/leyra-agent" --recover || true
          sudo rm -rf "/Library/Application Support/LeyraConnect"
          sudo "/Library/Application Support/Leyra/agent/leyra-agent" --install $(id -u)
          sudo launchctl bootstrap system /Library/LaunchDaemons/xin.leyra.agent.plist
          sleep 5; ls -l /var/run/leyra/agent.sock
      - uses: actions/setup-node@v4
        if: matrix.chip == 'apple-silicon'
        with:
          node-version: '20'
      - name: Customer click-through in the real interface (same test as Windows)
        if: matrix.chip == 'apple-silicon'
        env:
          TEST_CODE: ${{ needs.test-code.outputs[matrix.code_key] }}
          EXIT_LINK_PORT: ${{ needs.test-code.outputs.socks_port }}
          EXIT_LINK_PASS: ${{ needs.test-code.outputs.socks_pass }}
          LEYRA_PIPE: /var/run/leyra/agent.sock
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm install --silent playwright@1.48.2 && npx playwright install chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          EXIT_LINK="socks5://ci:${EXIT_LINK_PASS}@127.0.0.1:${EXIT_LINK_PORT}" NODE_PATH=/tmp/pw/node_modules node tests/e2e/customer-ui.mjs ui-shots
      - uses: actions/upload-artifact@v4
        if: always() && matrix.chip == 'apple-silicon'
        with:
          name: mac-ui-shots
          path: ui-shots
          if-no-files-found: ignore
          retention-days: 7
      - name: Service log on failure
        if: failure()
        run: |
          sudo tail -50 /var/log/leyra-agent.log || true
          sudo tail -50 "/Library/Application Support/LeyraConnect/agent-error.log" || true
      - name: Remove protection rules (always)
        if: always()
        run: sudo "/Library/Application Support/Leyra/agent/leyra-agent" --recover || true
  publish:
    # Only after both Macs passed; only when asked ([mac-publish] in the commit message, or the input).
    needs: test
    if: ${{ inputs.publish_to_website == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[mac-publish]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-package
          path: release
      - name: Upload the tested Mac package to the server and publish it
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        run: bash deploy/publish_release.sh release
  revoke-test-code:
    if: ${{ always() && needs.test-code.outputs.code != '' }}
    needs: [test-code, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Revoke the end-to-end test code
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
          TEST_CODE: ${{ needs.test-code.outputs.code }}
          UI_CODE: ${{ needs.test-code.outputs.ui_code }}
          SOCKS_PORT: ${{ needs.test-code.outputs.socks_port }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TEST_CODE" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          [[ -z "$UI_CODE" || "$UI_CODE" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          [[ "$SOCKS_PORT" =~ ^[0-9]{4,5}$ ]]
          key_file="$RUNNER_TEMP/leyra-key"; trap 'rm -f "$key_file"' EXIT; umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 \
            "release=\$(ls -d /opt/leyra-connect/releases/*/ | sort | tail -n1); sudo -n python3 \"\${release}admin.py\" --profile /root/leyra-server-connection.json --connect 127.0.0.1 license-revoke $TEST_CODE; [ -n '$UI_CODE' ] && sudo -n python3 \"\${release}admin.py\" --profile /root/leyra-server-connection.json --connect 127.0.0.1 license-revoke $UI_CODE; pkill -f \"[l]eyra-ci-socks.py $SOCKS_PORT \" || true"


# fresh run 20261120T0700 (0.4.29: each Mac its own test accounts; fake addresses 198.19)
