name: Windows native validation (explicit compute opt-in)
on:
  workflow_dispatch:
    inputs:
      allow_hosted_compute:
        description: 'Allow this one Windows run to consume included Actions minutes or incur metered compute charges'
        type: boolean
        required: true
        default: false
      publish_tested_run:
        description: 'Only publish: run number of an earlier run that already passed every test (skips building and testing)'
        type: string
        required: false
        default: ''
      publish_to_website:
        description: 'After the install test passes, publish this installer to the server (website download + automatic client update)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: windows-native-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ inputs.allow_hosted_compute == true && inputs.publish_tested_run == '' }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Windows components
        run: dotnet build windows/Leyra.Windows.Checks -c Release -m:1 --nologo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original interface integration
        run: |
          npm ci
          npm run test:ui
      - name: Compile desktop shell
        run: dotnet build windows/Leyra.Windows.Desktop -c Release -m:1 --nologo
      - name: Compile privileged service
        run: dotnet build windows/Leyra.Windows.Agent -c Release -m:1 --nologo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test device isolation and actual TLS interop
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          $env:PYTHONPATH = "$pwd/server"
          $env:LEYRA_CHECKS_DLL = "$pwd/windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll"
          python -m unittest discover -s server/tests -v
      - name: Execute existing assertions
        run: dotnet windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll
      - name: Exercise actual account credential verification
        run: dotnet windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll --native-credential-fixture
      - name: Prepare verified official Windows kernel
        run: python scripts/prepare_kernel.py windows artifacts/native-kernel
      - name: Exercise actual job-owned process management
        id: native_processes
        shell: pwsh
        run: |
          $env:LEYRA_NATIVE_KERNEL = "$pwd/artifacts/native-kernel/mihomo.exe"
          dotnet windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll --native-job-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native process fixture failed' }
      - name: Exercise actual TUN driver lifecycle
        id: native_tun
        if: ${{ success() || (failure() && steps.native_processes.outcome == 'failure') }}
        shell: pwsh
        run: |
          $env:LEYRA_NATIVE_KERNEL = "$pwd/artifacts/native-kernel/mihomo.exe"
          dotnet windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll --native-tun-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native TUN fixture failed' }
      - name: Exercise actual WFP only on this disposable hosted runner
        if: ${{ success() || (failure() && (steps.native_processes.outcome == 'failure' || steps.native_tun.outcome == 'failure')) }}
        run: dotnet windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll --native-wfp-fixture
      - name: Remove fixture-owned filters even after a failed check
        if: always()
        shell: pwsh
        run: |
          $fixture = 'windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll'
          if (Test-Path $fixture) {
            dotnet $fixture --cleanup-wfp-fixture
            if ($LASTEXITCODE -ne 0) { throw 'WFP cleanup failed; runner must be discarded' }
          }
  test-code:
    if: ${{ inputs.allow_hosted_compute == true && inputs.publish_tested_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.issue.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Issue a one-day authorization code for the end-to-end test
        id: issue
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/leyra-key"; trap 'rm -f "$key_file"' EXIT; umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          code=$(ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@43.129.187.240 \
            'release=$(ls -d /opt/leyra-connect/releases/*/ | sort | tail -n1); sudo -n python3 "${release}admin.py" --profile /root/leyra-server-connection.json --connect 127.0.0.1 license-new --days 1 --note "automated Windows test"')
          [[ "$code" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          echo "code=$code" >> "$GITHUB_OUTPUT"
  installer:
    if: ${{ inputs.allow_hosted_compute == true && inputs.publish_tested_run == '' }}
    needs: test-code
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Fetch official Microsoft WebView2 offline runtime and check its signature
        shell: pwsh
        run: |
          $dir = "artifacts/prerequisites"; New-Item -ItemType Directory -Force $dir | Out-Null
          $file = "$dir/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2124701' -OutFile $file
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'WebView2 runtime signature invalid' }
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ sha256 = $hash; source = 'https://go.microsoft.com/fwlink/?linkid=2124701' } | ConvertTo-Json | Set-Content "$dir/runtime-origin.json"
      - name: Build installer
        run: python scripts/build_windows_package.py --makensis "C:\Program Files (x86)\NSIS\makensis.exe"
      - name: Build the request tool used for the end-to-end test
        run: dotnet build windows/Leyra.Windows.Checks -c Release -m:1 --nologo
      - name: Silent install on this disposable Windows machine
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/Leyra-*-setup.exe | Select-Object -First 1
          # Leftover activation from an earlier, uninstalled version must not survive a fresh install.
          New-Item -ItemType Directory -Force "$env:ProgramData\LeyraConnect" | Out-Null
          Set-Content "$env:ProgramData\LeyraConnect\device-profile.json" '{"stale":true}'
          # Custom location, as a user would pick on the folder page.
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S','/D=C:\Apps\Leyra' -Wait -PassThru
          $log = Join-Path $env:TEMP 'LEYRAConnect-setup.log'
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { Get-Service LeyraConnect -ErrorAction SilentlyContinue | Format-List *; throw "Installer exit code $($p.ExitCode)" }
      - name: Verify installed program, files and running service
        shell: pwsh
        run: |
          $root = 'C:\Apps\Leyra'
          if ((Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\LEYRAConnect').InstallLocation -ne $root) { throw 'Install location not recorded for updates' }
          $version = (Get-ChildItem "$root\versions" -Directory | Select-Object -First 1).FullName
          foreach ($f in 'LeyraConnect.exe','Leyra.Agent.exe','mihomo.exe','kernel-origin.json','client-assets\win\index.html') {
            if (-not (Test-Path "$version\$f")) { throw "Missing installed file: $f" }
          }
          if (-not (Test-Path "$root\Uninstall.exe")) { throw 'Uninstaller missing' }
          Start-Sleep -Seconds 5
          $svc = Get-Service LeyraConnect
          Write-Host "Service status: $($svc.Status), start type: $($svc.StartType)"
          if ($svc.Status -ne 'Running') { throw 'Background service is not running' }
          if ($svc.StartType -ne 'Automatic') { throw 'Background service is not set to start automatically' }
          if (-not (Test-Path "$env:ProgramData\LeyraConnect\owner.sid")) { throw 'Runtime data directory not initialized' }
          if (Test-Path "$env:ProgramData\LeyraConnect\device-profile.json") { throw 'Stale activation survived a fresh install' }
          # The service must stay up (no crash loop) and reach the unactivated state.
          $pid1 = (Get-CimInstance Win32_Service -Filter "Name='LeyraConnect'").ProcessId
          Start-Sleep -Seconds 30
          $pid2 = (Get-CimInstance Win32_Service -Filter "Name='LeyraConnect'").ProcessId
          $log = "$env:ProgramData\LeyraConnect\agent-error.log"
          if (Test-Path $log) { Write-Host '--- agent-error.log ---'; Get-Content $log }
          $stateFile = "$env:ProgramData\LeyraConnect\agent-state.txt"
          $state = if (Test-Path $stateFile) { Get-Content $stateFile -Raw } else { '(missing)' }
          Write-Host "Agent state: $state  pid $pid1 -> $pid2"
          if ($pid1 -ne $pid2 -or $pid2 -eq 0) { throw 'Background service restarted (crash loop)' }
          if ($state -notmatch 'not_activated') { throw "Fresh install did not reach the activation state: $state" }
          Write-Host 'LEYRA_INSTALL_CHECK=PASS'
      - name: Customer flow end to end (activate, protected, recover, resume)
        shell: pwsh
        env:
          TEST_CODE: ${{ needs.test-code.outputs.code }}
        run: |
          $tool = (Resolve-Path 'windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll').Path
          $agent = (Get-ChildItem 'C:\Apps\Leyra\versions\*\Leyra.Agent.exe' | Select-Object -First 1).FullName
          $stateFile = "$env:ProgramData\LeyraConnect\agent-state.txt"
          function Ask($json) { $out = dotnet $tool --pipe $json; Write-Host "  -> $($out | Select-Object -First 1)"; return $LASTEXITCODE }
          function WaitFor($pattern, $seconds) {
            $end = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $end) { $s = if (Test-Path $stateFile) { Get-Content $stateFile -Raw } else { '' }; if ($s -match $pattern) { return $s }; Start-Sleep 2 }
            return (Get-Content $stateFile -Raw -ErrorAction SilentlyContinue)
          }
          # The service only answers the desktop user recorded at install time. On this hosted machine that
          # is not the account running these steps, so register this account as the owner (test setup only).
          Stop-Service LeyraConnect
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          [IO.File]::WriteAllText("$env:ProgramData\LeyraConnect\owner.sid", $sid)
          Start-Service LeyraConnect; Start-Sleep 5
          Write-Host "   owner set to $sid"
          Write-Host "   whoami: $(whoami) / elevated: $(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole('Administrators'))"
          Write-Host "   service runs as: $((Get-CimInstance Win32_Service -Filter "Name='LeyraConnect'").StartName)"
          # Safety net: whatever happens below, give this machine its network back within 4 minutes.
          $at = (Get-Date).AddMinutes(4).ToString('HH:mm')
          schtasks /Create /TN LeyraCiRecover /SC ONCE /ST $at /RU SYSTEM /TR "`"$agent`" --recover" /F | Out-Null
          $failures = @()
          Write-Host '1. status on a fresh install'
          if ((Ask '{"type":"status"}') -ne 0) { $failures += 'status request failed' }
          Write-Host '2. a wrong code is refused with a message, not a hang'
          if ((Ask '{"type":"activate","code":"ZZZZ-ZZZZ-ZZZZ-ZZZZ","contact":"ci"}') -eq 0) { $failures += 'wrong code was accepted' }
          Write-Host '3. a real code activates this computer'
          if ((Ask ('{"type":"activate","code":"' + $env:TEST_CODE + '","contact":"automated test"}')) -ne 0) { $failures += 'activation failed' }
          $s = WaitFor 'protected' 120; Write-Host "   state: $s"
          if ($s -notmatch 'protected') { $failures += "not protected after activation: $s" }
          Write-Host '   account and a full security check while protected'
          Ask '{"type":"account"}' | Out-Null
          dotnet $tool --pipe '{"type":"doctor"}' | Out-File doctor.json
          Write-Host '4. network recovery tool, then service start and resume (the 恢复防护 path)'
          & $agent --recover; Write-Host "   recover exit $LASTEXITCODE"
          Start-Service LeyraConnect; Start-Sleep 3
          if ((Ask '{"type":"resume"}') -ne 0) { $failures += 'resume request failed' }
          $s = WaitFor 'protected' 120; Write-Host "   state after resume: $s"
          if ($s -notmatch 'protected') { $failures += "not protected after resume: $s" }
          & $agent --recover | Out-Null
          schtasks /Delete /TN LeyraCiRecover /F | Out-Null
          if (Test-Path "$env:ProgramData\LeyraConnect\agent-error.log") { Write-Host '--- agent-error.log ---'; Get-Content "$env:ProgramData\LeyraConnect\agent-error.log" }
          if (Test-Path doctor.json) { Write-Host '--- security check verdicts ---'; (Get-Content doctor.json -Raw | ConvertFrom-Json).value.items | ForEach-Object { Write-Host "$($_.id) $($_.verdict)" } }
          if ($failures.Count) { $failures | ForEach-Object { Write-Host "FAIL: $_" }; throw 'Customer flow failed' }
          Write-Host 'LEYRA_CUSTOMER_FLOW=PASS'
      - name: Silent uninstall and verify cleanup
        if: always()
        shell: pwsh
        run: |
          $root = 'C:\Apps\Leyra'
          if (Test-Path "$root\Uninstall.exe") {
            $p = Start-Process -FilePath "$root\Uninstall.exe" -ArgumentList '/S',"_?=$root" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Uninstaller exit code $($p.ExitCode)" }
          }
          if (Get-Service LeyraConnect -ErrorAction SilentlyContinue) { throw 'Service still registered after uninstall' }
          if (Test-Path "$root\versions") { throw 'Program files left after uninstall' }
          if (Test-Path "$env:ProgramData\LeyraConnect") { throw 'Activation data left after uninstall' }
          Write-Host 'LEYRA_UNINSTALL_CHECK=PASS'
      - name: Upload installer for download
        uses: actions/upload-artifact@v4
        with:
          name: Leyra-windows-installer
          path: |
            artifacts/Leyra-*-setup.exe
            artifacts/Leyra-*-setup.sha256
          retention-days: 30
          compression-level: 0
  publish:
    if: ${{ inputs.allow_hosted_compute == true && inputs.publish_to_website == true }}
    needs: [native, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Leyra-windows-installer
          path: release
      - name: Upload the tested installer to the server and publish it
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: bash deploy/publish_release.sh release
  publish-tested:
    if: ${{ inputs.publish_tested_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Leyra-windows-installer
          path: release
          run-id: ${{ inputs.publish_tested_run }}
          github-token: ${{ github.token }}
      - name: Upload the tested installer to the server and publish it
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: bash deploy/publish_release.sh release
  revoke-test-code:
    if: ${{ always() && needs.test-code.outputs.code != '' }}
    needs: [test-code, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Revoke the end-to-end test code
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
          TEST_CODE: ${{ needs.test-code.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TEST_CODE" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          key_file="$RUNNER_TEMP/leyra-key"; trap 'rm -f "$key_file"' EXIT; umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@43.129.187.240 \
            "release=\$(ls -d /opt/leyra-connect/releases/*/ | sort | tail -n1); sudo -n python3 \"\${release}admin.py\" --profile /root/leyra-server-connection.json --connect 127.0.0.1 license-revoke $TEST_CODE"
