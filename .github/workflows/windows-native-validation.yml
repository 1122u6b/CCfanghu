name: Windows native validation (explicit compute opt-in)
on:
  workflow_dispatch:
    inputs:
      allow_hosted_compute:
        description: 'Allow this one Windows run to consume included Actions minutes or incur metered compute charges'
        type: boolean
        required: true
        default: false
      publish_tested_run:
        description: 'Only publish: run number of an earlier run that already passed every test (skips building and testing)'
        type: string
        required: false
        default: ''
      publish_to_website:
        description: 'After the install test passes, publish this installer to the server (website download + automatic client update)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: windows-native-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ inputs.allow_hosted_compute == true && inputs.publish_tested_run == '' }}
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Windows components
        run: dotnet build windows/Leyra.Windows.Checks -c Release -m:1 --nologo
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check original interface integration
        run: |
          npm ci
          npm run test:ui
      - name: Background service regression checks
        run: |
          dotnet build tests/AgentRegression/AgentRegression.csproj -c Release -m:1 --nologo
          dotnet tests/AgentRegression/bin/Release/net8.0-windows/AgentRegression.dll
      - name: Compile desktop shell
        run: dotnet build windows/Leyra.Windows.Desktop -c Release -m:1 --nologo
      - name: Compile privileged service
        run: dotnet build windows/Leyra.Windows.Agent -c Release -m:1 --nologo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test device isolation and actual TLS interop
        shell: pwsh
        run: |
          python -m pip install -r requirements-dev.txt
          $env:PYTHONPATH = "$pwd/server"
          $env:LEYRA_CHECKS_DLL = "$pwd/windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll"
          python -m unittest discover -s server/tests -v
      - name: Execute existing assertions
        run: dotnet windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll
      - name: Exercise actual account credential verification
        run: dotnet windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll --native-credential-fixture
      - name: Prepare verified official Windows kernel
        run: python scripts/prepare_kernel.py windows artifacts/native-kernel
      - name: Exercise actual job-owned process management
        id: native_processes
        shell: pwsh
        run: |
          $env:LEYRA_NATIVE_KERNEL = "$pwd/artifacts/native-kernel/mihomo.exe"
          dotnet windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll --native-job-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native process fixture failed' }
      - name: Exercise actual TUN driver lifecycle
        id: native_tun
        if: ${{ success() || (failure() && steps.native_processes.outcome == 'failure') }}
        shell: pwsh
        run: |
          $env:LEYRA_NATIVE_KERNEL = "$pwd/artifacts/native-kernel/mihomo.exe"
          dotnet windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll --native-tun-fixture
          if ($LASTEXITCODE -ne 0) { throw 'Native TUN fixture failed' }
      - name: Exercise actual WFP only on this disposable hosted runner
        if: ${{ success() || (failure() && (steps.native_processes.outcome == 'failure' || steps.native_tun.outcome == 'failure')) }}
        run: dotnet windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll --native-wfp-fixture
      - name: Remove fixture-owned filters even after a failed check
        if: always()
        shell: pwsh
        run: |
          $fixture = 'windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll'
          if (Test-Path $fixture) {
            dotnet $fixture --cleanup-wfp-fixture
            if ($LASTEXITCODE -ne 0) { throw 'WFP cleanup failed; runner must be discarded' }
          }
  test-code:
    if: ${{ inputs.allow_hosted_compute == true && inputs.publish_tested_run == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      code: ${{ steps.issue.outputs.code }}
      ui_code: ${{ steps.issue.outputs.ui_code }}
      socks_port: ${{ steps.issue.outputs.socks_port }}
      socks_pass: ${{ steps.issue.outputs.socks_pass }}
    steps:
      - uses: actions/checkout@v4
      - name: Issue a one-day authorization code for the end-to-end test
        id: issue
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/leyra-key"; trap 'rm -f "$key_file"' EXIT; umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          code=$(ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 \
            'release=$(ls -d /opt/leyra-connect/releases/*/ | sort | tail -n1); sudo -n python3 "${release}admin.py" --profile /root/leyra-server-connection.json --connect 127.0.0.1 license-new --days 1 --note "automated Windows test"')
          [[ "$code" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          echo "code=$code" >> "$GITHUB_OUTPUT"
          ui=$(ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 \
            'release=$(ls -d /opt/leyra-connect/releases/*/ | sort | tail -n1); sudo -n python3 "${release}admin.py" --profile /root/leyra-server-connection.json --connect 127.0.0.1 license-new --days 1 --note "automated UI click-through"')
          [[ "$ui" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          echo "ui_code=$ui" >> "$GITHUB_OUTPUT"
          # A temporary SOCKS5 proxy on the server stands in for the customer's own IP (loopback only, 40 minutes).
          port=$((20000 + RANDOM % 20000)); pass=$(openssl rand -hex 12)
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 \
            "cat > /tmp/leyra-ci-socks.py && (setsid nohup python3 /tmp/leyra-ci-socks.py $port ci $pass 2400 >/dev/null 2>&1 &) && sleep 1 && ss -ltn | grep -q ':$port '" < deploy/ci_socks5.py
          # GitHub refuses to pass on a URL containing user:password@, so hand over the parts.
          echo "socks_port=$port" >> "$GITHUB_OUTPUT"; echo "socks_pass=$pass" >> "$GITHUB_OUTPUT"
  installer:
    if: ${{ inputs.allow_hosted_compute == true && inputs.publish_tested_run == '' }}
    needs: test-code
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Fetch the official Microsoft WebView2 bootstrapper (2 MB) and check its signature
        shell: pwsh
        run: |
          $dir = "artifacts/prerequisites"; New-Item -ItemType Directory -Force $dir | Out-Null
          $file = "$dir/MicrosoftEdgeWebview2Setup.exe"
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $file
          $sig = Get-AuthenticodeSignature -LiteralPath $file
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'WebView2 runtime signature invalid' }
          $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ sha256 = $hash; source = 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' } | ConvertTo-Json | Set-Content "$dir/runtime-origin.json"
      - name: Build installer
        run: python scripts/build_windows_package.py --makensis "C:\Program Files (x86)\NSIS\makensis.exe"
      - name: Build the request tool used for the end-to-end test
        run: dotnet build windows/Leyra.Windows.Checks -c Release -m:1 --nologo
      - name: Silent install on this disposable Windows machine
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/Leyra-*-setup.exe | Select-Object -First 1
          # Leftover activation from an earlier, uninstalled version must not survive a fresh install.
          New-Item -ItemType Directory -Force "$env:ProgramData\LeyraConnect" | Out-Null
          Set-Content "$env:ProgramData\LeyraConnect\device-profile.json" '{"stale":true}'
          # Custom location, as a user would pick on the folder page.
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S','/D=C:\Apps\Leyra' -Wait -PassThru
          $log = Join-Path $env:TEMP 'LEYRAConnect-setup.log'
          if (Test-Path $log) { Get-Content $log }
          if ($p.ExitCode -ne 0) { Get-Service LeyraConnect -ErrorAction SilentlyContinue | Format-List *; throw "Installer exit code $($p.ExitCode)" }
      - name: Verify installed program, files and running service
        shell: pwsh
        run: |
          $root = 'C:\Apps\Leyra'
          if ((Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\LEYRAConnect').InstallLocation -ne $root) { throw 'Install location not recorded for updates' }
          $version = (Get-ChildItem "$root\versions" -Directory | Select-Object -First 1).FullName
          foreach ($f in 'LeyraConnect.exe','Leyra.Agent.exe','mihomo.exe','kernel-origin.json','client-assets\win\index.html') {
            if (-not (Test-Path "$version\$f")) { throw "Missing installed file: $f" }
          }
          if (-not (Test-Path "$root\Uninstall.exe")) { throw 'Uninstaller missing' }
          Start-Sleep -Seconds 5
          $svc = Get-Service LeyraConnect
          Write-Host "Service status: $($svc.Status), start type: $($svc.StartType)"
          if ($svc.Status -ne 'Running') { throw 'Background service is not running' }
          if ($svc.StartType -ne 'Automatic') { throw 'Background service is not set to start automatically' }
          if (-not (Test-Path "$env:ProgramData\LeyraConnect\owner.sid")) { throw 'Runtime data directory not initialized' }
          if (Test-Path "$env:ProgramData\LeyraConnect\device-profile.json") { throw 'Stale activation survived a fresh install' }
          # The service must stay up (no crash loop) and reach the unactivated state.
          $pid1 = (Get-CimInstance Win32_Service -Filter "Name='LeyraConnect'").ProcessId
          Start-Sleep -Seconds 30
          $pid2 = (Get-CimInstance Win32_Service -Filter "Name='LeyraConnect'").ProcessId
          $log = "$env:ProgramData\LeyraConnect\agent-error.log"
          if (Test-Path $log) { Write-Host '--- agent-error.log ---'; Get-Content $log }
          $stateFile = "$env:ProgramData\LeyraConnect\agent-state.txt"
          $state = if (Test-Path $stateFile) { Get-Content $stateFile -Raw } else { '(missing)' }
          Write-Host "Agent state: $state  pid $pid1 -> $pid2"
          if ($pid1 -ne $pid2 -or $pid2 -eq 0) { throw 'Background service restarted (crash loop)' }
          if ($state -notmatch 'not_activated') { throw "Fresh install did not reach the activation state: $state" }
          Write-Host 'LEYRA_INSTALL_CHECK=PASS'
      - name: Customer flow end to end (activate, protected, recover, resume)
        shell: pwsh
        env:
          TEST_CODE: ${{ needs.test-code.outputs.code }}
          SOCKS_PORT: ${{ needs.test-code.outputs.socks_port }}
          SOCKS_PASS: ${{ needs.test-code.outputs.socks_pass }}
        run: |
          $tool = (Resolve-Path 'windows/Leyra.Windows.Checks/bin/Release/net8.0/Leyra.Windows.Checks.dll').Path
          $agent = (Get-ChildItem 'C:\Apps\Leyra\versions\*\Leyra.Agent.exe' | Select-Object -First 1).FullName
          $stateFile = "$env:ProgramData\LeyraConnect\agent-state.txt"
          # Requests are sent like the customer's desktop app: same service verification, and from a basic-user
          # token without administrator rights (runas /trustlevel), which is how the app normally runs.
          New-Item -ItemType Directory -Force C:\LeyraCi | Out-Null
          icacls C:\LeyraCi /grant "*S-1-1-0:(OI)(CI)M" | Out-Null
          $dotnetExe = (Get-Command dotnet).Source
          Set-Content C:\LeyraCi\run.cmd "@set LEYRA_EXPECT_AGENT=$agent`r`n@`"$dotnetExe`" `"$tool`" --pipe-file C:\LeyraCi\req_%1.json C:\LeyraCi\out_%1.json" -Encoding ascii
          $script:n = 0; $script:adminSeen = $false
          function Ask($json) {
            $script:n++; $i = $script:n
            Set-Content "C:\LeyraCi\req_$i.json" $json -Encoding utf8NoBOM
            runas /trustlevel:0x20000 "C:\LeyraCi\run.cmd $i" | Out-Null
            $end = [DateTime]::UtcNow.AddSeconds(150)
            while (-not (Test-Path "C:\LeyraCi\out_$i.json") -and [DateTime]::UtcNow -lt $end) { Start-Sleep 1 }
            if (-not (Test-Path "C:\LeyraCi\out_$i.json")) { Write-Host '  -> no answer (limited request did not finish)'; return 9 }
            $o = Get-Content "C:\LeyraCi\out_$i.json" -Raw | ConvertFrom-Json
            if ($o.admin) { $script:adminSeen = $true }
            $text = if ($o.error) { $o.error } else { ($o.reply | ConvertTo-Json -Depth 6 -Compress) }
            Write-Host "  -> [admin=$($o.admin)] $($text.Substring(0, [Math]::Min(300, $text.Length)))"
            return [int]$o.exit
          }
          function WaitFor($pattern, $seconds) {
            $end = [DateTime]::UtcNow.AddSeconds($seconds)
            while ([DateTime]::UtcNow -lt $end) { $s = if (Test-Path $stateFile) { Get-Content $stateFile -Raw } else { '' }; if ($s -match $pattern) { return $s }; Start-Sleep 2 }
            return (Get-Content $stateFile -Raw -ErrorAction SilentlyContinue)
          }
          # The service only answers the desktop user recorded at install time. On this hosted machine that
          # is not the account running these steps, so register this account as the owner (test setup only).
          Stop-Service LeyraConnect
          $sid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          [IO.File]::WriteAllText("$env:ProgramData\LeyraConnect\owner.sid", $sid)
          Start-Service LeyraConnect; Start-Sleep 5
          Write-Host "   owner set to $sid"
          Write-Host "   whoami: $(whoami) / elevated: $(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole('Administrators'))"
          Write-Host "   service runs as: $((Get-CimInstance Win32_Service -Filter "Name='LeyraConnect'").StartName)"
          # Safety net: whatever happens below, give this machine its network back within 4 minutes.
          $at = (Get-Date).AddMinutes(12).ToString('HH:mm')
          schtasks /Create /TN LeyraCiRecover /SC ONCE /ST $at /RU SYSTEM /TR "`"$agent`" --recover" /F | Out-Null
          $failures = @()
          Write-Host '0. windows that connect and drop at once must not stop the service from answering'
          dotnet $tool --pipe-stress 200 | Select-Object -Last 3 | ForEach-Object { Write-Host "   $_" }
          if ($LASTEXITCODE -ne 0) { $failures += 'service stopped answering after dropped connections (fresh install)' }
          Write-Host '1. status on a fresh install'
          if ((Ask '{"type":"status"}') -ne 0) { $failures += 'status request failed' }
          Write-Host '2. a wrong code is refused with a message, not a hang'
          if ((Ask '{"type":"activate","code":"ZZZZ-ZZZZ-ZZZZ-ZZZZ","contact":"ci"}') -eq 0) { $failures += 'wrong code was accepted' }
          Write-Host '3. a real code activates this computer'
          if ((Ask ('{"type":"activate","code":"' + $env:TEST_CODE + '","contact":"automated test"}')) -ne 0) { $failures += 'activation failed' }
          # 和原版一样：激活后先等客户「接入你的出口」，不建线路、不接管网络。
          Start-Sleep 8; $s = Get-Content $stateFile -Raw; Write-Host "   state right after activation: $s"
          if ($s -notmatch 'provisioning') { $failures += "after activation it should wait for the customer's own exit: $s" }
          Ask '{"type":"account"}' | Out-Null
          if ((Get-Content "C:\LeyraCi\out_$script:n.json" -Raw) -notmatch '"own_exit":"waiting"') { $failures += 'account does not ask for the own exit' }
          Write-Host '   customer pastes their own IP in 接入你的出口'
          if (-not $env:SOCKS_PORT -or -not $env:SOCKS_PASS) { $failures += 'test setup: the temporary proxy details did not arrive' }
          $link = "socks5://ci:$($env:SOCKS_PASS)@127.0.0.1:$($env:SOCKS_PORT)"
          if ((Ask ('{"type":"own_exit","links":"' + $link + '"}')) -ne 0) { $failures += 'importing the own exit failed' }
          $s = WaitFor 'protected' 120; Write-Host "   state: $s"
          if ($s -notmatch 'protected') { $failures += "not protected after connecting the own exit: $s" }
          Write-Host '   stays protected for 90 seconds without dropping (no on/off flapping)'
          $drops = 0; $end = [DateTime]::UtcNow.AddSeconds(90)
          while ([DateTime]::UtcNow -lt $end) { $x = Get-Content $stateFile -Raw; if ($x -notmatch 'protected') { $drops++; Write-Host "   dropped: $x" }; Start-Sleep 3 }
          if ($drops) { $failures += "protection dropped $drops times within 90 seconds" } else { Write-Host '   stayed protected the whole time' }
          Write-Host '   busy computer: 60 connections open at once for 75 seconds, protection must not drop'
          $hold = Start-Job -ScriptBlock { param($t) dotnet $t --hold 60 75 2>&1; "exit=$LASTEXITCODE" } -ArgumentList $tool
          $busyDrops = 0; $end = [DateTime]::UtcNow.AddSeconds(85)
          while ([DateTime]::UtcNow -lt $end) { $x = Get-Content $stateFile -Raw; if ($x -notmatch 'protected') { $busyDrops++; Write-Host "   dropped: $x" }; Start-Sleep 3 }
          $held = Receive-Job $hold -Wait -AutoRemoveJob; $held | Select-Object -Last 3 | ForEach-Object { Write-Host "   $_" }
          if ($held -notcontains 'exit=0') { $failures += 'could not keep 60 connections open through the line' }
          if ($busyDrops) { $failures += "protection dropped $busyDrops times while 60 connections were open" } else { Write-Host '   stayed protected with 60 connections open' }
          Write-Host '   the exit list reaches the interface in the shape it reads'
          Ask '{"type":"account"}' | Out-Null
          $acct = Get-Content "C:\LeyraCi\out_$script:n.json" -Raw | ConvertFrom-Json
          if ($null -eq $acct.reply.value.exits.list -or -not $acct.reply.value.exits.can_add) { $failures += 'account exits are not {list, can_add}' }
          Write-Host '   full security check while protected'
          Ask '{"type":"doctor"}' | Out-Null; Copy-Item "C:\LeyraCi\out_$script:n.json" doctor.json -ErrorAction SilentlyContinue
          Write-Host '   the exit in use stops working: Leyra switches to the customer''s other exit by itself'
          Ask '{"type":"account"}' | Out-Null
          $goodExit = ((Get-Content "C:\LeyraCi\out_$script:n.json" -Raw | ConvertFrom-Json).reply.value.exits.list | Where-Object { $_.current } | Select-Object -First 1).id
          if ((Ask '{"type":"own_exit","links":"socks5://ci:wrong@127.0.0.1:1","name":"坏的出口"}') -ne 0) { $failures += 'could not add the second (broken) exit' }
          $badExit = (Get-Content "C:\LeyraCi\out_$script:n.json" -Raw | ConvertFrom-Json).reply.value.id
          Start-Sleep 6
          $s = WaitFor 'protected' 150; Write-Host "   state: $s"
          Ask '{"type":"account"}' | Out-Null
          $nowExit = ((Get-Content "C:\LeyraCi\out_$script:n.json" -Raw | ConvertFrom-Json).reply.value.exits.list | Where-Object { $_.current } | Select-Object -First 1).id
          Ask '{"type":"history"}' | Out-Null
          $switched = (Get-Content "C:\LeyraCi\out_$script:n.json" -Raw) -match 'exit_failover'
          Write-Host "   good exit $goodExit, broken exit $badExit, now using $nowExit, switch recorded: $switched"
          if ($s -notmatch 'protected' -or $nowExit -ne $goodExit) { $failures += "did not switch back to the working exit by itself: $s (using $nowExit)" }
          if (-not $switched) { $failures += 'the automatic exit switch was not recorded in recent activity' }
          if ($badExit) { Ask ('{"type":"delete_exit","id":' + $badExit + '}') | Out-Null }
          Write-Host '   only listed sites go through the exit, the rest connects directly (and back to everything through the exit)'
          function SeenIp {
            for ($k = 1; $k -le 3; $k++) {
              try { return (Invoke-WebRequest https://api.ipify.org -UseBasicParsing -TimeoutSec 25).Content.Trim() } catch { $last = 'error ' + $_.Exception.Message; Start-Sleep 3 }
            }
            return $last
          }
          WaitFor 'protected' 150 | Out-Null; Start-Sleep 5   # the previous step just switched exits; let the line settle
          function Route($json) { Ask $json | Out-Null; Start-Sleep 4; return (WaitFor 'protected' 150) }
          $ipAll = SeenIp; Write-Host "   everything through the exit: sites see $ipAll"
          # icanhazip.com stands in for a listed site (ipify.org always goes through the exit: the browser check uses it).
          function SeenIp2 { for ($k = 1; $k -le 3; $k++) { try { return (Invoke-WebRequest https://icanhazip.com -UseBasicParsing -TimeoutSec 25).Content.Trim() } catch { $last = 'error ' + $_.Exception.Message; Start-Sleep 3 } }; return $last }
          $s = Route '{"type":"set_route_mode","listed":true,"domains":["icanhazip.com"]}'
          $ipListed = SeenIp2; Write-Host "   list = icanhazip.com: it sees $ipListed"
          if ($s -notmatch 'protected') { $failures += "list mode did not come back protected: $s" }
          $s = Route '{"type":"set_route_mode","listed":true,"domains":["example.com"]}'
          $ipDirect = SeenIp2; $web = try { (Invoke-WebRequest https://www.microsoft.com -UseBasicParsing -TimeoutSec 25).StatusCode } catch { 0 }
          Write-Host "   list = example.com: icanhazip (not listed) sees $ipDirect, another site answers $web"
          $s = Route '{"type":"set_route_mode","listed":false}'
          $ipBack = SeenIp; Write-Host "   list mode off again: sites see $ipBack"
          if ($ipAll -notmatch '^\d+\.\d+\.\d+\.\d+$') { $failures += "could not read the exit IP: $ipAll" }
          if ($ipListed -ne $ipAll) { $failures += "a listed site did not go through the exit: $ipListed vs $ipAll" }
          if ($ipDirect -notmatch '^\d+\.\d+\.\d+\.\d+$' -or $ipDirect -eq $ipAll) { $failures += "a site not on the list did not connect directly: $ipDirect" }
          if ($web -ne 200) { $failures += "direct connections were blocked in list mode: $web" }
          if ($s -notmatch 'protected' -or $ipBack -ne $ipAll) { $failures += "switching back to everything through the exit failed: $s / $ipBack" }
          Write-Host '   coexist: the customer keeps their own proxy app on; Claude (the list) goes through the Leyra exit'
          $is = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          $ownLog = "$env:RUNNER_TEMP\own-proxy.log"; Set-Content $ownLog ''
          $own = Start-Process -FilePath (Get-Command python).Source -ArgumentList 'mac/tests/local_proxy.py','7890',$ownLog -PassThru -WindowStyle Hidden
          Start-Sleep 2
          Set-ItemProperty $is ProxyEnable 1; Set-ItemProperty $is ProxyServer '127.0.0.1:7890'
          $s = Route '{"type":"set_route_mode","listed":false,"domains":["ipify.org"]}'
          if ($s -notmatch 'protected') { $failures += "coexist mode did not come up protected: $s" }
          $server = (Get-ItemProperty $is).ProxyServer; Write-Host "   system proxy now: $server"
          if ($server -ne '127.0.0.1:17890') { $failures += "the system proxy was not put in front of the customer's proxy: $server" }
          $L = try { (Invoke-WebRequest https://api.ipify.org -Proxy http://127.0.0.1:17890 -UseBasicParsing -TimeoutSec 25).Content.Trim() } catch { 'error ' + $_.Exception.Message }
          $O = try { (Invoke-WebRequest https://icanhazip.com -Proxy http://127.0.0.1:17890 -UseBasicParsing -TimeoutSec 25).StatusCode } catch { 0 }
          $ownWeb = try { (Invoke-WebRequest https://www.microsoft.com -Proxy http://127.0.0.1:7890 -UseBasicParsing -TimeoutSec 25).StatusCode } catch { 0 }
          $handled = (Get-Content $ownLog) -join ' '
          Write-Host "   listed site sees $L; other site $O; own proxy on its own $ownWeb; own proxy handled: $handled"
          if ($L -ne $ipAll) { $failures += "in coexist mode the listed site did not go through the exit: $L vs $ipAll" }
          if ($handled -notmatch 'icanhazip') { $failures += 'in coexist mode other sites were not handed to the customer proxy' }
          if ($handled -match 'ipify') { $failures += 'in coexist mode the listed site went through the customer proxy' }
          if ($ownWeb -ne 200) { $failures += "the customer's own proxy was blocked in coexist mode: $ownWeb" }
          Ask '{"type":"check_conflicts"}' | Out-Null
          if ((Get-Content "C:\LeyraCi\out_$script:n.json" -Raw) -match 'proxy-owner') { $failures += 'coexist mode still asks to quit the customer proxy' }
          # Claude always through the exit, although the list (ipify.org only) does not name it.
          $trace = try { (Invoke-WebRequest https://claude.ai/cdn-cgi/trace -Proxy http://127.0.0.1:17890 -UseBasicParsing -TimeoutSec 25).Content } catch { '' }
          $claudeIp = ([regex]::Match($trace, 'ip=([0-9a-fA-F.:]+)')).Groups[1].Value; Write-Host "   claude.ai sees $claudeIp (exit $ipAll)"
          if ($claudeIp -ne $ipAll) { $failures += "Claude did not go through the exit in coexist mode: $claudeIp" }
          # The line breaks (kernel ended): Claude must be refused or still on the exit, never another address.
          Stop-Process -Name mihomo -Force -ErrorAction SilentlyContinue
          $seen = @(); $end = [DateTime]::UtcNow.AddSeconds(25)
          while ([DateTime]::UtcNow -lt $end) {
            $tr = try { (Invoke-WebRequest https://claude.ai/cdn-cgi/trace -Proxy http://127.0.0.1:17890 -UseBasicParsing -TimeoutSec 5).Content } catch { '' }
            $ip = ([regex]::Match($tr, 'ip=([0-9a-fA-F.:]+)')).Groups[1].Value; if ($ip) { $seen += $ip }
            Start-Sleep -Milliseconds 500
          }
          $other = $seen | Where-Object { $_ -ne $ipAll } | Select-Object -Unique
          Write-Host "   while the line was down and back: Claude answered $($seen.Count) times, other addresses: $($other -join ',')"
          if ($other) { $failures += "while the line was down Claude went out through another address: $($other -join ',')" }
          $s = WaitFor 'protected' 150
          if ($s -notmatch 'protected') { $failures += "coexist protection did not come back after the line broke: $s" }
          Set-ItemProperty $is ProxyServer '127.0.0.1:7890'
          $end = [DateTime]::UtcNow.AddSeconds(25); while ((Get-ItemProperty $is).ProxyServer -ne '127.0.0.1:17890' -and [DateTime]::UtcNow -lt $end) { Start-Sleep 2 }
          if ((Get-ItemProperty $is).ProxyServer -ne '127.0.0.1:17890') { $failures += 'Leyra did not take the system proxy back' } else { Write-Host '   taken back after the customer app changed it' }
          Ask '{"type":"pause","minutes":10}' | Out-Null; Start-Sleep 3
          $after = (Get-ItemProperty $is).ProxyServer; Write-Host "   after pause: $after"
          if ($after -ne '127.0.0.1:7890') { $failures += "the customer's system proxy was not given back on pause: $after" }
          Stop-Process -Id $own.Id -Force -ErrorAction SilentlyContinue
          Set-ItemProperty $is ProxyEnable 0; Remove-ItemProperty $is ProxyServer -ErrorAction SilentlyContinue
          $s = Route '{"type":"resume"}'
          if ($s -notmatch 'protected') { $failures += "normal protection did not come back after coexist: $s" }
          Write-Host '   another proxy app turns on the system proxy: it is named, and 帮我退出 really ends it'
          $py = (Get-Command python).Source
          $fake = Start-Process -FilePath $py -ArgumentList '-m','http.server','18888','--bind','127.0.0.1' -PassThru -WindowStyle Hidden
          Start-Sleep 4
          $is = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          Set-ItemProperty $is ProxyEnable 1; Set-ItemProperty $is ProxyServer '127.0.0.1:18888'
          Ask '{"type":"check_conflicts"}' | Out-Null
          $c = (Get-Content "C:\LeyraCi\out_$script:n.json" -Raw | ConvertFrom-Json).reply.value.items | Where-Object { $_.id -like 'proxy-owner-*' } | Select-Object -First 1
          if (-not $c) { $failures += 'the program behind the system proxy was not identified' }
          else {
            Write-Host "   found: $($c.name) ($($c.evidence))"
            Ask ('{"type":"shell_action","command":"force_quit_conflict","args":{"id":"' + $c.id + '"}}') | Out-Null
            Start-Sleep 2
            if (-not $fake.HasExited) { $failures += 'the program behind the system proxy is still running after 帮我退出' } else { Write-Host '   it was ended' }
            if ((Get-ItemProperty $is).ProxyEnable -ne 0) { $failures += 'system proxy still on after ending its program' } else { Write-Host '   system proxy switched off' }
          }
          if (-not $fake.HasExited) { Stop-Process -Id $fake.Id -Force }
          Set-ItemProperty $is ProxyEnable 0
          Write-Host '   dropped connections while protected'
          dotnet $tool --pipe-stress 200 | Select-Object -Last 3 | ForEach-Object { Write-Host "   $_" }
          if ($LASTEXITCODE -ne 0) { $failures += 'service stopped answering after dropped connections (protected)' }
          Write-Host '   blocking rules left behind while the activation is gone (reinstall): they are removed, the computer is online'
          $data = "$env:ProgramData\LeyraConnect"
          Stop-Service LeyraConnect; Start-Sleep 2
          Move-Item "$data\device-profile.json" "$env:RUNNER_TEMP\profile.bak" -Force
          Start-Service LeyraConnect; Start-Sleep 10
          $web = try { (Invoke-WebRequest https://www.microsoft.com -UseBasicParsing -TimeoutSec 25).StatusCode } catch { 0 }
          Write-Host "   not activated, a site answers: $web"
          if ($web -ne 200) { $failures += 'blocking rules from before stayed after the activation was gone (activation would time out)' }
          Stop-Service LeyraConnect; Move-Item "$env:RUNNER_TEMP\profile.bak" "$data\device-profile.json" -Force; Start-Service LeyraConnect
          $s = WaitFor 'protected' 150
          if ($s -notmatch 'protected') { $failures += "protection did not come back after the activation was restored: $s" }
          Write-Host '   彻底退出 while protected takes effect within 10 seconds'
          $t0 = [DateTime]::UtcNow
          if ((Ask '{"type":"pause","minutes":10,"reason":"quit"}') -ne 0) { $failures += '彻底退出 request failed' }
          $took = ([DateTime]::UtcNow - $t0).TotalSeconds; Write-Host ("   彻底退出 answered in {0:N1} s" -f $took)
          if ($took -gt 10) { $failures += "彻底退出 took $took seconds" }
          $s = WaitFor 'paused' 10; if ($s -notmatch 'paused') { $failures += "not stopped after 彻底退出: $s" }
          Write-Host '4. network recovery tool, then service start and resume (the 恢复防护 path)'
          & $agent --recover; Write-Host "   recover exit $LASTEXITCODE"
          Start-Service LeyraConnect; Start-Sleep 3
          if ((Ask '{"type":"resume"}') -ne 0) { $failures += 'resume request failed' }
          $s = WaitFor 'protected' 120; Write-Host "   state after resume: $s"
          if ($s -notmatch 'protected') { $failures += "not protected after resume: $s" }
          & $agent --recover | Out-Null
          schtasks /Delete /TN LeyraCiRecover /F | Out-Null
          if (Test-Path "$env:ProgramData\LeyraConnect\agent-error.log") { Write-Host '--- agent-error.log ---'; Get-Content "$env:ProgramData\LeyraConnect\agent-error.log" }
          if ($script:adminSeen) { $failures += 'requests ran with administrator rights; the limited-user path was not tested' }
          if (Test-Path doctor.json) { Write-Host '--- security check verdicts ---'; (Get-Content doctor.json -Raw | ConvertFrom-Json).reply.value.items | ForEach-Object { Write-Host "$($_.id) $($_.verdict) $($_.detail)"; if ($_.id -eq 'L8' -and $_.verdict -eq 'fail') { $failures += "false leak alarm: $($_.detail)" }; if ($_.id -eq 'P7' -and $_.verdict -ne 'pass') { $failures += "browser WebRTC protection not set automatically: $($_.detail)" }; if ($_.id -eq 'C1' -and $_.verdict -ne 'pass') { $failures += "timezone not matched to the exit automatically: $($_.detail)" } } }
          if ($failures.Count) { $failures | ForEach-Object { Write-Host "FAIL: $_" }; throw 'Customer flow failed' }
          Write-Host 'LEYRA_CUSTOMER_FLOW=PASS'
      - name: Fresh reinstall for the customer click-through
        shell: pwsh
        run: |
          $root = 'C:\Apps\Leyra'
          $p = Start-Process -FilePath "$root\Uninstall.exe" -ArgumentList '/S',"_?=$root" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstaller exit code $($p.ExitCode)" }
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' ProxyEnable 0 -ErrorAction SilentlyContinue
          $setup = Get-ChildItem artifacts/Leyra-*-setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S','/D=C:\Apps\Leyra' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer exit code $($p.ExitCode)" }
          # The service answers only the desktop user recorded at install; on this machine that is this account.
          Stop-Service LeyraConnect
          [IO.File]::WriteAllText("$env:ProgramData\LeyraConnect\owner.sid", [Security.Principal.WindowsIdentity]::GetCurrent().User.Value)
          Start-Service LeyraConnect; Start-Sleep 5
          Write-Host "reinstalled; state: $(Get-Content "$env:ProgramData\LeyraConnect\agent-state.txt" -Raw -ErrorAction SilentlyContinue)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Customer click-through in the real interface (activate, own exit, speed test, security check, browser check, timezone, quit)
        shell: pwsh
        env:
          UI_CODE: ${{ needs.test-code.outputs.ui_code }}
          SOCKS_PORT: ${{ needs.test-code.outputs.socks_port }}
          SOCKS_PASS: ${{ needs.test-code.outputs.socks_pass }}
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1 | Out-Null
          npx playwright install chromium | Out-Null
          $agent = (Get-ChildItem 'C:\Apps\Leyra\versions\*\Leyra.Agent.exe' | Select-Object -First 1).FullName
          # Safety net: whatever happens, give this machine its network back.
          $at = (Get-Date).AddMinutes(15).ToString('HH:mm')
          schtasks /Create /TN LeyraCiRecoverUi /SC ONCE /ST $at /RU SYSTEM /TR "`"$agent`" --recover" /F | Out-Null
          $env:TEST_CODE = $env:UI_CODE
          $env:EXIT_LINK = "socks5://ci:$($env:SOCKS_PASS)@127.0.0.1:$($env:SOCKS_PORT)"
          node tests/e2e/customer-ui.mjs ui-shots
          $code = $LASTEXITCODE
          & $agent --recover | Out-Null
          schtasks /Delete /TN LeyraCiRecoverUi /F | Out-Null
          if (Test-Path "$env:ProgramData\LeyraConnect\agent-error.log") { Write-Host '--- agent-error.log (last 30 lines) ---'; Get-Content "$env:ProgramData\LeyraConnect\agent-error.log" | Select-Object -Last 30 }
          if ($code -ne 0) { throw 'Customer click-through failed' }
      - name: Upload click-through screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ui-shots
          retention-days: 7
          if-no-files-found: ignore
      - name: Silent uninstall and verify cleanup
        if: always()
        shell: pwsh
        run: |
          $root = 'C:\Apps\Leyra'
          if (Test-Path "$root\Uninstall.exe") {
            $p = Start-Process -FilePath "$root\Uninstall.exe" -ArgumentList '/S',"_?=$root" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Uninstaller exit code $($p.ExitCode)" }
          }
          if (Get-Service LeyraConnect -ErrorAction SilentlyContinue) { throw 'Service still registered after uninstall' }
          if (Test-Path "$root\versions") { throw 'Program files left after uninstall' }
          if (Test-Path "$env:ProgramData\LeyraConnect") { throw 'Activation data left after uninstall' }
          $tz = (Get-TimeZone).Id; Write-Host "timezone after uninstall: $tz"
          if ($tz -ne 'UTC') { throw "Timezone not restored after uninstall: $tz" }
          Write-Host 'LEYRA_UNINSTALL_CHECK=PASS'
      - name: Upload installer for download
        uses: actions/upload-artifact@v4
        with:
          name: Leyra-windows-installer
          path: |
            artifacts/Leyra-*-setup.exe
            artifacts/Leyra-*-setup.sha256
          retention-days: 30
          compression-level: 0
  publish:
    if: ${{ inputs.allow_hosted_compute == true && inputs.publish_to_website == true }}
    needs: [native, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Leyra-windows-installer
          path: release
      - name: Upload the tested installer to the server and publish it
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: bash deploy/publish_release.sh release
  publish-tested:
    if: ${{ inputs.publish_tested_run != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Leyra-windows-installer
          path: release
          run-id: ${{ inputs.publish_tested_run }}
          github-token: ${{ github.token }}
      - name: Upload the tested installer to the server and publish it
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: bash deploy/publish_release.sh release
  revoke-test-code:
    if: ${{ always() && needs.test-code.outputs.code != '' }}
    needs: [test-code, installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Revoke the end-to-end test code
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
          TEST_CODE: ${{ needs.test-code.outputs.code }}
          UI_CODE: ${{ needs.test-code.outputs.ui_code }}
          SOCKS_PORT: ${{ needs.test-code.outputs.socks_port }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TEST_CODE" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          [[ -z "$UI_CODE" || "$UI_CODE" =~ ^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$ ]]
          [[ "$SOCKS_PORT" =~ ^[0-9]{4,5}$ ]]
          key_file="$RUNNER_TEMP/leyra-key"; trap 'rm -f "$key_file"' EXIT; umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          ssh -T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$GITHUB_WORKSPACE/deploy/known_hosts" ubuntu@129.226.74.173 \
            "release=\$(ls -d /opt/leyra-connect/releases/*/ | sort | tail -n1); sudo -n python3 \"\${release}admin.py\" --profile /root/leyra-server-connection.json --connect 127.0.0.1 license-revoke $TEST_CODE; [ -n '$UI_CODE' ] && sudo -n python3 \"\${release}admin.py\" --profile /root/leyra-server-connection.json --connect 127.0.0.1 license-revoke $UI_CODE; pkill -f \"[l]eyra-ci-socks.py $SOCKS_PORT \" || true"
