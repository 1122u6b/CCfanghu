name: Publish an already tested installer
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run number of a passed "Windows native validation" run whose installer should be published'
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Leyra-windows-installer
          path: release
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Upload to the server in resumable pieces and publish
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: bash deploy/publish_release.sh release
