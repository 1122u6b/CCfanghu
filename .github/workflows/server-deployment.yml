name: Owner application deployment (manual only)
on:
  push:
    branches: [server-connection-20261116]
  workflow_dispatch:
    inputs:
      allow_hosted_compute:
        description: Allow this bounded owner-authorized application deployment
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: leyra-server-operation
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ inputs.allow_hosted_compute == true || (github.event_name == 'push' && github.ref == 'refs/heads/server-connection-20261116') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile deployment source before sending it
        run: python3 -m compileall -q server deploy
      - name: Apply only the LEYRA gateway and DNS release, then verify locally
        env:
          LEYRA_SSH_KEY: ${{ secrets.LEYRA_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${LEYRA_SSH_KEY:-}" ]]; then
            echo '::error::LEYRA_SSH_KEY is not configured.'
            exit 1
          fi
          key_file="$RUNNER_TEMP/leyra-key"
          umask 077
          printf '%s\n' "$LEYRA_SSH_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          ssh-keygen -y -f "$key_file" > /dev/null
          remote_stage="/tmp/leyra-stage-${GITHUB_RUN_ID}"
          [[ "$remote_stage" =~ ^/tmp/leyra-stage-[0-9]+$ ]]
          ssh_options=(-T -F /dev/null -i "$key_file" -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=12 -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$GITHUB_WORKSPACE/deploy/known_hosts")
          cleanup() {
            ssh "${ssh_options[@]}" ubuntu@43.129.187.240 "sudo -n rm -rf -- '$remote_stage'" > /dev/null 2>&1 || true
            rm -f "$key_file" "$RUNNER_TEMP/leyra-source.tar.gz"
          }
          trap cleanup EXIT
          tar -czf "$RUNNER_TEMP/leyra-source.tar.gz" server/gateway.py server/management.py server/devices.py server/dns_probe.py server/ai_login.py server/verify_live.py deploy/install_existing_server.py deploy/perform_server_deployment.py
          ssh "${ssh_options[@]}" ubuntu@43.129.187.240 "umask 077; mkdir -- '$remote_stage' && tar --no-same-owner -xzf - -C '$remote_stage'" < "$RUNNER_TEMP/leyra-source.tar.gz"
          ssh "${ssh_options[@]}" ubuntu@43.129.187.240 "sudo -n python3 '$remote_stage/deploy/perform_server_deployment.py'"
