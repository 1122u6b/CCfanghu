function route() {
  var page = current(); if (!P[page]) page = 'home';
  Array.prototype.forEach.call(document.querySelectorAll('#nav a'), function (a) { a.className = a.getAttribute('href') === '#/' + (page === 'home' ? '' : page) ? 'on' : ''; });
  $('main').innerHTML = P[page]();
  var anchor = page === 'price' && document.getElementById('price');
  if (anchor) anchor.scrollIntoView(); else window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
// Only pages that show download/help data re-render; never wipe a form the visitor is typing in.
function refreshInfo() { acct(); if (['home', 'price', 'guide', 'help', 'me'].indexOf(current()) >= 0 || !P[current()]) route(); }
acct(); route();
fetch('/api/site/info').then(function (r) { return r.json(); }).then(function (i) { INFO = i; refreshInfo(); }).catch(function () { INFO = {}; refreshInfo(); });
</script>
</body>
</html>
