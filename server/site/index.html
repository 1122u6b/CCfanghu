<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leyra · 你的专属网络通道</title>
<meta name="description" content="Leyra：独享线路、断线自动保护真实 IP 的 Windows 桌面客户端。">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--bg:#f7f8f6;--card:#ffffff;--text:#16201c;--muted:#5f6b66;--line:#e2e7e4;--accent:#0f7b5f;--accent-2:#e8f4ef;--danger:#b4342b;--warn:#9a6200;--shadow:0 1px 2px rgba(20,40,30,.06),0 8px 24px rgba(20,40,30,.06)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1412;--card:#161d1a;--text:#e6ece9;--muted:#9aa8a2;--line:#26302c;--accent:#3cc497;--accent-2:#16302a;--danger:#ff7a6e;--warn:#e8b14d;--shadow:none}}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
a{color:var(--accent)}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:20px;height:60px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:var(--text);text-decoration:none;letter-spacing:.3px}
nav{display:flex;gap:2px;flex:1;overflow-x:auto}nav a{color:var(--muted);text-decoration:none;padding:6px 12px;border-radius:8px;white-space:nowrap}nav a.on,nav a:hover{color:var(--text);background:var(--accent-2)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}.btn.big{padding:14px 26px;font-size:17px}.btn:disabled{opacity:.5;cursor:default}
.hero{padding:72px 0 48px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:44px;line-height:1.2;margin:0 0 16px;letter-spacing:-.5px}.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:17px;color:var(--muted);margin:0 0 28px;max-width:34em}
.sub{color:var(--muted);font-size:13px;margin-top:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.status{display:flex;align-items:center;gap:10px;font-weight:600}.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px var(--accent-2)}
.flow{display:flex;align-items:center;justify-content:space-between;margin:26px 0;gap:8px}.node{text-align:center;font-size:13px;color:var(--muted)}.node b{display:block;width:56px;height:56px;margin:0 auto 6px;border-radius:14px;background:var(--accent-2);display:grid;place-items:center;color:var(--accent);font-size:22px}
.line{flex:1;height:2px;background:repeating-linear-gradient(90deg,var(--accent) 0 8px,transparent 8px 14px);opacity:.6}
.checks{list-style:none;margin:0;padding:0}.checks li{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:14px}.checks li span{color:var(--accent);font-weight:600}
section{padding:48px 0}h2{font-size:28px;margin:0 0 8px}.lead2{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.card h3{margin:6px 0 6px;font-size:17px}.card p{margin:0;color:var(--muted);font-size:14px}
.ico{width:36px;height:36px;border-radius:10px;background:var(--accent-2);color:var(--accent);display:grid;place-items:center;font-weight:700}
.steps{counter-reset:s;display:grid;gap:14px}.step{display:grid;grid-template-columns:44px 1fr;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.step::before{counter-increment:s;content:counter(s);width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.step h3{margin:4px 0 4px;font-size:16px}.step p{margin:0;color:var(--muted);font-size:14px}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}details p{color:var(--muted);margin:10px 0 0;white-space:pre-wrap}
.form{max-width:420px;margin:56px auto}.form h2{margin-bottom:18px}label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}input:focus{outline:2px solid var(--accent);border-color:transparent}
.err{color:var(--danger);font-size:14px;min-height:22px;margin-top:10px}.ok{color:var(--accent)}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}.tag.wait{background:#fff3dc;color:var(--warn)}.tag.on{background:var(--accent-2);color:var(--accent)}.tag.off{background:#fde6e4;color:var(--danger)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted);font-weight:500}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:13px;margin-top:40px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;display:none;z-index:9;max-width:90vw}
@media (max-width:820px){nav a{font-size:14px}.logo span{display:none}.hero{grid-template-columns:1fr;padding-top:40px}.hero h1{font-size:34px}.grid{grid-template-columns:1fr}nav a{padding:6px 8px}header .wrap{gap:10px}.hide-sm{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
 <a class="logo" href="#/"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M11 8v16h11" stroke="#fff" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Leyra</a>
 <nav id="nav"><a href="#/">首页</a><a href="#/guide">使用教程</a><a href="#/help">常见问题</a></nav>
 <span id="acct"></span>
</div></header>
<main id="main" class="wrap"></main>
<footer><div class="wrap">Leyra · 仅支持 64 位 Windows 10 / 11</div></footer>
<div id="toast"></div>
<script>
'use strict';
var INFO = null, TOKEN = null;
try { TOKEN = localStorage.getItem('leyra.session'); } catch (e) {}
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
function day(t) { var d = new Date(t * 1000); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 3500); }
function api(path, body) {
  var h = {}; if (TOKEN) h.Authorization = 'Bearer ' + TOKEN; if (body) h['Content-Type'] = 'application/json';
  return fetch('/api/site/' + path, { method: body ? 'POST' : 'GET', headers: h, body: body ? JSON.stringify(body) : undefined }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (r.status === 401 && TOKEN) { setToken(null); }
      if (!r.ok) throw new Error(j.error || '出错了，请稍后再试'); return j;
    });
  });
}
function setToken(t) { TOKEN = t; try { t ? localStorage.setItem('leyra.session', t) : localStorage.removeItem('leyra.session'); } catch (e) {} acct(); }
function acct() { $('acct').innerHTML = TOKEN ? '<a class="btn" href="#/me">我的账号</a>' : '<a class="btn hide-sm" href="#/login">登录</a> <a class="btn p" href="#/register">注册</a>'; }
function save(name, obj) { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function dl() {
  if (!INFO) return '<button class="btn p big" disabled>正在读取…</button>';
  if (!INFO.download) return '<button class="btn p big" disabled>安装包即将上线</button>';
  return '<a class="btn p big" href="' + INFO.download + '"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5.5 10.5 4.5v7H3zm8.5-1.2L21 3v8.5h-9.5zM3 12.5h7.5v7L3 18.5zm8.5 0H21V21l-9.5-1.3z"/></svg>下载 Windows 版</a>';
}
function dlNote() { return INFO && INFO.version ? '版本 ' + esc(INFO.version) + ' · ' + (INFO.size / 1048576).toFixed(0) + ' MB · Windows 10 / 11（64 位）' : 'Windows 10 / 11（64 位）'; }

var P = {};
P.home = function () {
  return '<div class="hero"><div><h1>一条只属于你的线路，<br><em>开着就安心</em></h1>' +
    '<p class="lead">Leyra 是一个 Windows 桌面客户端：电脑的网络统一走你的独享线路，线路一断就先断网，绝不悄悄换回本地网络，真实 IP 不会漏出去。装好导入连接文件就能用，不用自己配代理。</p>' +
    dl() + ' <a class="btn big" href="#/register">注册账号</a><div class="sub">' + dlNote() + '</div></div>' +
    '<div class="panel"><div class="status"><span class="dot"></span>防护中 <span class="sub" style="margin:0;font-weight:400">（示意）</span></div>' +
    '<div class="flow"><div class="node"><b>▣</b>你的电脑</div><div class="line"></div><div class="node"><b>⛨</b>独享线路</div><div class="line"></div><div class="node"><b>◎</b>网站</div></div>' +
    '<ul class="checks"><li>真实 IP 隐藏<span>已确认</span></li><li>网址查询不经过本地<span>已确认</span></li><li>浏览器 WebRTC 不泄露<span>已确认</span></li><li>线路断开时自动断网<span>已开启</span></li></ul></div></div>' +
    '<section><h2>为什么用 Leyra</h2><p class="lead2">不只是「能连上」，而是每时每刻都确认没有漏。</p><div class="grid">' +
    card('独', '独享线路', '每台电脑独立凭据，不和别人共用，单独停用、单独更换。') +
    card('断', '断线即断网', '线路出问题时先断网再重连，不会退回本地网络暴露真实地址。') +
    card('检', '全面自检', '30 多项检查：系统、防护规则、网址查询、浏览器、绕过的软件，一键体检。') +
    card('出', '自带出口也能用', '支持粘贴卖家给的 SOCKS5、HTTP、ss、vmess、trojan 等链接和订阅。') +
    card('单', '断网也能提工单', '遇到问题在软件里直接提交工单、上传截图，客服在后台回复。') +
    card('新', '自动更新', '新版本自动下载、核对完整性后再提示安装，不用重新下载。') +
    '</div></section>' +
    '<section><h2>三步开始</h2><p class="lead2">注册 → 等开通 → 下载连接文件导入软件。</p><div class="steps">' +
    step('注册账号', '在本站注册，留下联系方式。') + step('等待开通', '我们确认后会为你开通，开通后登录「我的账号」能看到。') +
    step('下载连接文件，导入软件', '在「我的账号」里为这台电脑生成连接文件；安装 Leyra 后点「导入设备连接文件」选它即可。') + '</div></section>';
};
function card(i, t, d) { return '<div class="card"><div class="ico">' + i + '</div><h3>' + t + '</h3><p>' + d + '</p></div>'; }
function step(t, d) { return '<div class="step"><div><h3>' + t + '</h3><p>' + d + '</p></div></div>'; }
P.guide = function () {
  return '<section><h2>使用教程</h2><p class="lead2">第一次使用，照着做一遍大约 5 分钟。</p><div class="steps">' +
    step('下载并安装', '点首页的「下载 Windows 版」，双击安装包，一路点「下一步」。如果 Windows 提示「已保护你的电脑」，点「更多信息」→「仍要运行」。') +
    step('拿到连接文件', '登录本站「我的账号」，账号开通后点「添加这台电脑」，浏览器会下载一个 .json 文件。一台电脑一个文件，不要给别人用。') +
    step('导入连接文件', '打开桌面上的 Leyra，点「导入设备连接文件」，选刚才下载的 .json 文件，等几秒显示「已保护」就好了。') +
    step('（可选）接入你自己的出口', '如果你自己买了住宅代理，在 Leyra 的出口设置里粘贴卖家给的链接或订阅地址。') +
    step('做一次安全检查', '在 Leyra 里点「安全检查」，全部通过就可以放心使用了。') +
    '</div>' + (INFO && INFO.guides && INFO.guides.length ? '<h2 style="margin-top:36px">更多指南</h2>' + INFO.guides.map(function (g) { return '<p><a href="' + esc(g.url) + '" target="_blank" rel="noopener noreferrer">' + esc(g.title) + '</a> <span class="sub">' + esc(g.text || '') + '</span></p>'; }).join('') : '') + '</section>';
};
var DEFAULT_FAQ = [
  ['安装时 Windows 提示「已保护你的电脑」怎么办？', '点「更多信息」，再点「仍要运行」。这是因为安装包还没有购买微软的代码签名，不影响使用。'],
  ['为什么有时候会断网？', '线路暂时不通时，Leyra 会先断网再重连，防止你的真实 IP 暴露。通常几秒到几十秒会自动恢复。'],
  ['连接文件丢了或者想换电脑？', '登录「我的账号」，对那台电脑点「重新下载」，旧文件会立即失效。换电脑时在新电脑上导入新文件即可。'],
  ['我能在几台电脑上用？', '每个账号能用的电脑数量由开通时确定，需要更多请联系客服。'],
  ['怎么暂停或退出？', '在 Leyra 里点「暂停防护」或「彻底退出」，为了安全会先要求输入电脑开机密码。']];
P.help = function () {
  var faq = INFO && INFO.faq && INFO.faq.length ? INFO.faq.map(function (f) { return [f.q, f.a]; }) : DEFAULT_FAQ;
  return '<section><h2>常见问题</h2><p class="lead2">没找到答案？登录后在 Leyra 软件里提交工单。</p>' + faq.map(function (f) { return '<details><summary>' + esc(f[0]) + '</summary><p>' + esc(f[1]) + '</p></details>'; }).join('') + '</section>';
};
P.login = function () {
  return '<div class="form panel"><h2>登录</h2><label>账号</label><input id="lg" autocomplete="username"><label>密码</label><input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')doLogin()">' +
    '<div class="err" id="err"></div><button class="btn p big" style="width:100%" onclick="doLogin()">登录</button><p class="sub">还没有账号？<a href="#/register">注册</a></p></div>';
};
P.register = function () {
  return '<div class="form panel"><h2>注册</h2><label>账号（手机号、邮箱或字母数字，3 到 64 位）</label><input id="lg" autocomplete="username"><label>密码（至少 8 位）</label><input id="pw" type="password" autocomplete="new-password">' +
    '<label>再输一次密码</label><input id="pw2" type="password" autocomplete="new-password"><label>联系方式（微信 / QQ / 邮箱，开通后通知你）</label><input id="ct">' +
    '<div class="err" id="err"></div><button class="btn p big" style="width:100%" onclick="doRegister()">注册</button><p class="sub">已有账号？<a href="#/login">登录</a></p></div>';
};
function doLogin() {
  $('err').textContent = '';
  api('login', { login: $('lg').value.trim(), password: $('pw').value }).then(function (r) { setToken(r.token); location.hash = '#/me'; }).catch(function (e) { $('err').textContent = e.message; });
}
function doRegister() {
  $('err').textContent = '';
  if ($('pw').value !== $('pw2').value) { $('err').textContent = '两次输入的密码不一样'; return; }
  var login = $('lg').value.trim(), pw = $('pw').value;
  api('register', { login: login, password: pw, contact: $('ct').value.trim() })
    .then(function () { return api('login', { login: login, password: pw }); })
    .then(function (r) { setToken(r.token); location.hash = '#/me'; toast('注册成功'); }).catch(function (e) { $('err').textContent = e.message; });
}
P.me = function () {
  if (!TOKEN) { location.hash = '#/login'; return ''; }
  api('me').then(function (m) {
    if (current() !== 'me') return;
    var st = m.status === 'active' ? '<span class="tag on">已开通</span>' : m.status === 'pending' ? '<span class="tag wait">等待开通</span>' : '<span class="tag off">已停用</span>';
    var html = '<section><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">' + esc(m.login) + ' ' + st + '</h2><div class="sub">联系方式：' + esc(m.contact) + '</div></div><button class="btn" onclick="doLogout()">退出登录</button></div></div>';
    if (m.status === 'pending') html += '<div class="panel" style="margin-top:16px"><h3>账号正在等待开通</h3><p class="sub" style="font-size:15px">我们会尽快通过你留的联系方式联系你。开通后刷新本页，就能为你的电脑下载连接文件。</p><p>先把软件装好：</p>' + dl() + '</div>';
    if (m.status === 'active') {
      html += '<div class="panel" style="margin-top:16px"><h3 style="margin-top:0">我的电脑（' + m.devices.length + ' / ' + m.max_devices + '）</h3>' +
        (m.devices.length ? '<table><tr><th>名称</th><th>添加时间</th><th>状态</th><th></th></tr>' + m.devices.map(function (d) {
          return '<tr><td>' + esc(d.name) + '</td><td>' + day(d.created_at) + '</td><td>' + (d.enabled ? '<span class="tag on">可用</span>' : '<span class="tag off">已停用</span>') + '</td><td><button class="btn" onclick="rotate(\'' + d.id + '\',\'' + esc(d.name) + '\')">重新下载连接文件</button></td></tr>';
        }).join('') + '</table><p class="sub">「重新下载」会让这台电脑的旧连接文件立即失效，需要在 Leyra 里重新导入新文件。</p>' : '<p class="sub">还没有添加电脑。</p>') +
        (m.devices.length < m.max_devices ? '<label>给这台电脑起个名字</label><div style="display:flex;gap:10px"><input id="dn" placeholder="例如：家里的电脑" maxlength="40"><button class="btn p" onclick="addDevice()">添加这台电脑</button></div>' : '<p class="sub">已达到账号可用的电脑数量，需要更多请联系客服。</p>') +
        '</div><div class="panel" style="margin-top:16px"><h3 style="margin-top:0">下载软件</h3>' + dl() + '<div class="sub">' + dlNote() + '</div></div>';
    }
    if (m.status === 'disabled') html += '<div class="panel" style="margin-top:16px"><p>这个账号已停用，如有疑问请联系客服。</p></div>';
    $('main').innerHTML = html + '</section>';
  }).catch(function (e) { if (current() !== 'me') return; toast(e.message); if (!TOKEN) location.hash = '#/login'; });
  return '<section><p class="sub">正在读取…</p></section>';
};
function fileName(n) { return 'Leyra-' + n.replace(/[\\/:*?"<>|\s]+/g, '_') + '.json'; }
function addDevice() {
  var n = $('dn').value.trim(); if (!n) { toast('请先给电脑起个名字'); return; }
  api('devices', { name: n }).then(function (r) { save(fileName(n), r.profile); toast('连接文件已下载，打开 Leyra 导入它即可'); route(); }).catch(function (e) { toast(e.message); });
}
function rotate(id, n) {
  if (!confirm('重新下载后，这台电脑原来的连接文件会立即失效，需要在 Leyra 里导入新文件。继续吗？')) return;
  api('rotate', { id: id }).then(function (r) { save(fileName(n), r.profile); toast('新的连接文件已下载'); }).catch(function (e) { toast(e.message); });
}
function doLogout() { api('logout', {}).catch(function () {}).then(function () { setToken(null); location.hash = '#/'; }); }
function route() {
  var page = (location.hash.replace(/^#\/?/, '') || 'home').split('?')[0];
  if (!P[page]) page = 'home';
  Array.prototype.forEach.call(document.querySelectorAll('#nav a'), function (a) { a.className = a.getAttribute('href') === '#/' + (page === 'home' ? '' : page) ? 'on' : ''; });
  $('main').innerHTML = P[page](); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

function current() { return (location.hash.replace(/^#\/?/, '') || 'home').split('?')[0]; }
